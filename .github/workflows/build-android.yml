name: Android APK yig'ish

# mobile/ papkasiga tegishli o'zgarish main'ga tushganda avtomatik ishga
# tushadi. Bu yerda (GitHub'ning ubuntu-latest runner'ida) Android SDK
# tayyor bo'lgani uchun .apk fayl haqiqatan ham shu yerda tuziladi —
# rivojlantirish muhitida (bu loyihaning asosiy sandbox'ida) Android SDK
# yo'q va uni yuklab olish tarmoq siyosati bilan bloklangan.
on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/build-android.yml'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Kodni olish
        uses: actions/checkout@v4

      - name: Node o'rnatish
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: JDK o'rnatish
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Android SDK o'rnatish
        uses: android-actions/setup-android@v3

      - name: Bog'liqliklarni o'rnatish
        run: npm ci

      - name: Capacitor android loyihasini sinxronlash
        run: npx cap sync android

      - name: Debug APK yig'ish
        working-directory: mobile/android
        run: ./gradlew assembleDebug --no-daemon

      - name: APK'ni artifact sifatida yuklash
        uses: actions/upload-artifact@v4
        with:
          name: mindhub-debug-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # Actions artifact'lar Azure Blob Storage'da saqlanadi va ba'zi tarmoq
      # siyosatlarida bloklangan bo'lishi mumkin. Shuning uchun APK'ni GitHub
      # Release sifatida ham e'lon qilamiz — release asset'lar
      # objects.githubusercontent.com orqali, kengroq ochiq manzilda beriladi.
      - name: APK'ni "android-latest" release sifatida e'lon qilish
        working-directory: .
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete android-latest --yes --cleanup-tag || true
          gh release create android-latest \
            mobile/android/app/build/outputs/apk/debug/app-debug.apk \
            --title "MindHub Android (debug APK) — avtomatik" \
            --notes "Eng so'nggi avtomatik tuzilgan debug APK. Commit: ${{ github.sha }}" \
            --target "${{ github.sha }}"
