name = "mindhub"
main = "src/index.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# Statik frontend (public/) — Worker so'rovni o'zi ko'tarmasa avval shu papkadan
# javob beriladi (SPA fallback: topilmasa index.html qaytadi, /api/* bundan mustasno).
[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/ws", "/uploads/*"]

# ── D1 (SQLite) — asosiy baza ──
# `wrangler d1 create mindhub-db` dan keyin chiqqan haqiqiy database_id'ni
# bu yerga qo'ying (deploy qilishdan oldin — README-DEPLOY.md'ga qarang).
[[d1_databases]]
binding = "DB"
database_name = "mindhub-db"
database_id = "REPLACE_WITH_REAL_D1_ID"
migrations_dir = "migrations"

# ── R2 — yuklangan fayllar (avatar, post rasmi, ovozli xabar, chat rasm) ──
[[r2_buckets]]
binding = "UPLOADS"
bucket_name = "mindhub-uploads"

# ── Durable Object — har foydalanuvchi uchun jonli WebSocket ulanishlari ──
# (xabar, bildirishnoma, qo'ng'iroq signalizatsiyasini yetkazish uchun)
[[durable_objects.bindings]]
name = "USER_HUB"
class_name = "UserHub"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["UserHub"]

[triggers]
# GEMINI_API_KEY kech qo'shilsa, "pending" qolgan murojaatlarni har 5 daqiqada qayta ishlaydi.
crons = ["*/5 * * * *"]

[vars]
APP_NAME = "MindHub"
TG_BOT_NAME = "mind_hubbot"

# ── Maxfiy kalitlar (env vars emas, `wrangler secret put <NOM>` bilan qo'yiladi) ──
# SECRET            — token/parolni imzolash kaliti (majburiy)
# GEMINI_API_KEY    — Google Gemini API kaliti (AI toifalash/klasterlash/yechim uchun)
# RESEND_API_KEY    — email yuborish uchun (ixtiyoriy, bo'lmasa email o'chiq turadi)
# TG_BOT_TOKEN      — Telegram bot tokeni (ixtiyoriy, Telegram bilan kirish/bog'lash uchun)
